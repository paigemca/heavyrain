<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gameArea">

<div id="bgLayer"><img src="assets/bg.jpg"></div>

<div id="stormOverlay"></div>
<div id="cloudContainer">
<img id="cloud" src="assets/cloud.png" alt="">

<div id="title">
  <img class="title-heavy" src="assets/title-heavy.png" alt="heavy">
  <img class="title-rain" src="assets/title-rain.png" alt="rain">
</div>
</div>

<img id="character" src="assets/character.png" alt="">

<!-- Hidden sprite sources, read by js/state.js -->
<div id="sprites" hidden>
<img id="heart" src="assets/heart.png" alt="">
<img id="star0" src="assets/star0.png" alt="">
<img id="star1" src="assets/star1.png" alt="">
<img id="star2" src="assets/star2.png" alt="">
<img id="star3" src="assets/star3.png" alt="">
<img id="drop0" src="assets/drop0.png" alt="">
<img id="drop1" src="assets/drop1.png" alt="">
<img id="drop2" src="assets/drop2.png" alt="">
<img id="drop3" src="assets/drop3.png" alt="">
<img id="drop4" src="assets/drop4.png" alt="">
</div>

<img id="creditImg" src="assets/credit.png" alt="created by paige">
<button id="pauseBtn">&#9646;&#9646;</button>
<button id="audioBtn">&#9835;</button>
<div id="audioPanel"><iframe src="https://open.spotify.com/embed/playlist/5vpxurqeli1mWZIaCUtOPR?utm_source=generator&theme=0" width="300" height="200" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
<div id="score"><img id="scoreDropImg" src="assets/star0.png" alt=""><span id="scoreNum">0</span></div>
<div id="gameUI">
<div id="lives"></div>
<div id="flash"></div>
<div id="gameOver">
  <h1><img src="assets/text-game-over.png" alt="game over"></h1>
  <div id="gameOverDetails">
    <p id="finalScore"></p>
    <p id="bestScore"></p>
    <p id="submitMsg"></p>
    <button id="playAgain"><img class="star star-play" src="assets/star1.png" alt=""> <img class="text-img text-play" src="assets/text-play.png" alt="play"><img class="text-img text-again" src="assets/text-again.png" alt="again"> <img class="star star-play" src="assets/star1.png" alt=""></button>
    <button id="gameOverLeaderboardBtn"><img class="star star-btn" src="assets/star0.png" alt=""> <img class="text-img text-leaderboard-btn" src="assets/text-leaderboard.png" alt="leaderboard"> <img class="star star-btn" src="assets/star0.png" alt=""></button>
  </div>
</div>
<div id="hint"></div>
<div id="ctrlPicker"><button class="ctrl-opt" data-mode="tilt">tilt</button><button class="ctrl-opt" data-mode="zones">tap</button></div>
<div id="tiltDeniedModal"><div id="tiltDeniedCard"><h3>tilt access denied</h3><p>your device is blocking motion access for this site.</p><button id="tiltDeniedZonesBtn">play with tap instead</button><p id="tiltDeniedHint">to enable tilt:<br>Settings &rarr; Safari &rarr; Advanced<br>&rarr; Website Data &rarr; search for "github"<br>&rarr; clear data, then reload.</p></div></div>
<div id="leaderboardPanel"><p id="pausedMsg">game paused</p><h2><img class="star star-title" src="assets/star2.png" alt=""> <img class="text-img text-leaderboard-title" src="assets/text-leaderboard.png" alt="leaderboard"> <img class="star star-title" src="assets/star2.png" alt=""></h2><ul id="leaderboardList"></ul><button id="closeLeaderboard">close</button></div>
<button id="leaderboardBtn"><img class="star star-btn" src="assets/star0.png" alt=""> <img class="text-img text-leaderboard-btn" src="assets/text-leaderboard.png" alt="leaderboard"> <img class="star star-btn" src="assets/star0.png" alt=""></button>
<div id="highScore"></div>
<div id="nameWrap"><div id="nameInput" contenteditable="true" spellcheck="false" data-placeholder="enter alias"></div><div id="nameError"></div></div>
<button id="startBtn"><img class="star star-play" src="assets/star1.png" alt=""> <img class="text-img text-play" src="assets/text-play.png" alt="play"> <img class="star star-play" src="assets/star1.png" alt=""></button>
</div>
</div>

<!-- Wide screens (≥700px) only -->
<div id="leaderboardSidebar">
  <div id="soundtrackTitle"><img class="star star-sm" src="assets/star3.png" alt=""> <img class="text-img text-sound" src="assets/text-rec.png" alt="rec"> <img class="text-img text-sound" src="assets/text-sound.png" alt="sound"> <img class="star star-sm" src="assets/star3.png" alt=""></div>
  <div id="sidebarPlayer"><iframe src="https://open.spotify.com/embed/playlist/5vpxurqeli1mWZIaCUtOPR?utm_source=generator" width="100%" height="200" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
  <h2 id="sidebarTitle"><img class="star star-title" src="assets/star2.png" alt=""> <img class="text-img text-leaderboard-title" src="assets/text-leaderboard.png" alt="leaderboard"> <img class="star star-title" src="assets/star2.png" alt=""></h2>
  <ul id="sidebarList"></ul>
</div>

<!-- Load order matters: these share globals, and main.js runs startup last -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/character.js"></script>
<script src="js/controls.js"></script>
<script src="js/rain.js"></script>
<script src="js/game.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
